services:
  - type: web
    name: saferoute
    runtime: python
    repo: https://github.com/Rachit2k5/safetynet
    branch: main
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: cd backend_fastapi && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        value: "saferoute-super-secret-key-production-2026-secure-32bytes"
      - key: RENDER
        value: "1"
